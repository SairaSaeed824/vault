<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17152d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Concept Vault</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#17152d}button,input,textarea,select{font:inherit}.app{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#17152d,#6c4ab6);color:#fff;border-radius:28px;padding:24px;margin-bottom:16px;box-shadow:0 12px 30px #17152d22}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;opacity:.85}.search{width:100%;padding:14px 16px;border:0;border-radius:16px;margin-top:18px;outline:none}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.chip{border:1px solid #ddd8ee;background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap}.chip.active{background:#17152d;color:#fff}.grid{display:grid;gap:14px}.card{background:#fff;border:1px solid #eceaf2;border-radius:20px;padding:18px;box-shadow:0 6px 18px #17152d0b}.card h2{margin:0 0 8px;font-size:20px}.tag{font-size:12px;background:#eeeafa;padding:5px 9px;border-radius:999px}.card p{line-height:1.55;color:#4d4a59}.card ul{line-height:1.55;color:#4d4a59}.code{background:#17152d;color:#fff;border-radius:12px;padding:13px;overflow:auto;font-size:13px;white-space:pre-wrap}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:10px;padding:9px 12px}.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:#17152d;color:#fff;font-size:28px;box-shadow:0 8px 24px #17152d44}.empty{text-align:center;padding:40px;color:#777}.overlay{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center;z-index:5}.overlay.show{display:flex}.modal{background:#fff;width:100%;max-width:650px;border-radius:26px 26px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{display:block;margin:12px 0}.field span{display:block;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px}.field textarea{min-height:100px}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1;padding:13px;border:0;border-radius:12px}.primary{background:#17152d;color:#fff}.secondary{background:#eee}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="app">
<section class="hero"><div class="toprow"><div><h1>📚 Concept Vault</h1><p>Your personal programming + interview learning library</p></div></div><input id="search" class="search" placeholder="Search concepts or interview topics..."></section>
<div id="chips" class="chips"></div>
<main id="grid" class="grid"></main>
</div>
<button id="addBtn" class="fab" aria-label="Add concept">+</button>
<div id="overlay" class="overlay"><div class="modal">
<h2 id="modalTitle">Add Concept</h2>
<label class="field"><span>Title</span><input id="title"></label>
<label class="field"><span>Category</span><input id="category" placeholder="C++, DSA, Interview Prep..."></label>
<label class="field"><span>Explanation</span><textarea id="explanation"></textarea></label>
<label class="field"><span>Code / Example</span><textarea id="code"></textarea></label>
<div class="modal-actions"><button id="cancel" class="secondary">Cancel</button><button id="save" class="primary">Save</button></div>
</div></div>
<script>
const VAULT_VERSION="2026-09-19-pointer-to-pointer-v1";
const seed=[
{title:"Dynamic Memory",category:"C++ / Memory",explanation:"Dynamic memory is memory allocated while the program is running. In C++, new creates an object in dynamically allocated memory and returns its address. A pointer stores that address. delete releases memory allocated with new.",points:["new → allocates memory and returns an address.","A pointer stores that address.","*p accesses the value at that address.","delete releases dynamically allocated memory.","nullptr makes a pointer point to nothing."],code:"int *p = new int(10);\ncout << *p; // 10\ndelete p;\np = nullptr;"},
{title:"Memory Leak",category:"C++ / Memory",explanation:"A memory leak happens when dynamically allocated memory is still reserved, but the program loses the pointer needed to release it. The memory remains occupied and cannot be freed through that lost pointer.",points:["Memory is still allocated.","The pointer/address is lost.","The program cannot call delete on that allocation.","Repeated leaks can waste memory.","Do not lose the only pointer before deleting the memory."],code:"int *p = new int(10);\np = nullptr; // old address lost → memory leak\n\n// Correct:\nint *q = new int(10);\ndelete q;\nq = nullptr;"},
{title:"Dangling Pointer",category:"C++ / Memory",explanation:"A dangling pointer is a pointer that still contains an old address after the memory it pointed to has been released or is no longer valid. Dereferencing it causes undefined behavior.",points:["delete releases the object.","The pointer may still contain the old address.","*p after delete is undefined behavior.","Set the pointer to nullptr after delete.","Memory Leak: memory remains, pointer/access is lost. Dangling Pointer: memory is released, pointer remains."],code:"int *p = new int(10);\ndelete p;\ncout << *p; // ❌ undefined behavior\np = nullptr; // safe state"},
{title:"Pointer Arguments / Pass by Value",category:"C++ / Pointers",explanation:"When a normal variable is passed by value, the function receives a copy, so changing the parameter does not change the original variable. When a pointer is passed by value, the pointer itself is copied, but the copied pointer contains the same address as the original data. Therefore *p can change the original variable, while changing p itself only changes the local pointer copy.",points:["Pass by value → function receives a copy.","A pointer passed by value → the address is copied.","*p changes the value at that address, so the original variable can change.","p = nullptr changes only the local pointer copy.","Memory trick: *p → data; p → pointer/address."],code:"void change(int *p) {\n    *p = 50;      // changes original data\n    p = nullptr;  // only local p changes\n}\n\nint a = 10;\nint *q = &a;\nchange(q);\ncout << a << \" \" << *q; // 50 50"},
{title:"Pass by Reference",category:"C++ / Functions",explanation:"Pass by reference means the function parameter becomes another name (alias) for the original variable. No separate copy of the variable is made. Changes made to the reference directly change the original variable.",points:["Use & in the parameter: int &x.","The function works with the original variable.","Changing x changes the original variable.","No pointer dereferencing is needed.","Memory trick: reference = another name for the same variable."],code:"void change(int &x) {\n    x = 50;\n}\n\nint a = 10;\nchange(a);\ncout << a; // 50"},
{title:"Size of Array vs Pointer",category:"C++ / Arrays & Pointers",explanation:"An array stores multiple elements, while a pointer stores a memory address. sizeof(array) gives the size of the whole array. sizeof(pointer) gives the size of the pointer itself. On a typical 64-bit system, pointers are usually 8 bytes because a memory address is represented using 64 bits (64 ÷ 8 = 8 bytes).",points:["sizeof(arr) → size of the entire array.","sizeof(p) → size of the pointer/address.","If int is 4 bytes and arr has 5 elements, sizeof(arr) = 20 bytes.","On a typical 64-bit system, sizeof(p) is usually 8 bytes.","Memory trick: array = whole box; pointer = address of the box."],code:"int arr[5] = {10, 20, 30, 40, 50};\nint *p = arr;\n\ncout << sizeof(arr); // 20 bytes (if int = 4 bytes)\ncout << sizeof(p);   // 8 bytes on a typical 64-bit system"},{title:"Pointer to Pointer (int**)",category:"C++ / Pointers",explanation:"A pointer to pointer is a pointer that stores the address of another pointer. In int **q, q points to an int pointer, and that int pointer points to an integer value.",points:["int *p stores the address of an int variable.","int **q stores the address of the pointer p.","*q gives the pointer p.","**q gives the actual integer value.","Memory trick: one * = one level of following an address."],code:"int a = 10;\nint *p = &a;\nint **q = &p;\n\ncout << a;   // 10\ncout << *p;  // 10\ncout << **q; // 10\n\n**q = 50;\ncout << a;   // 50"},{title:"Pointer Basics",category:"C++ / Pointers",explanation:"A pointer is a variable that stores the memory address of another variable. Remember: & gets an address, * declares a pointer and dereferences it, p stores an address, and *p gives the value at that address.",points:["p → address.","*p → value at that address.","&x → address of x.","Changing *p changes the original variable.","Initialize a pointer before dereferencing it."],code:"int x = 10;\nint *p = &x;\ncout << p;  // address\ncout << *p; // 10\n*p = 20;\ncout << x;  // 20"}]

let concepts=seed;
localStorage.setItem("conceptVault",JSON.stringify(seed));
localStorage.setItem("conceptVaultVersion",VAULT_VERSION);
let editing=-1,currentCategory="All";
const $=id=>document.getElementById(id);
function cats(){return ["All",...new Set(concepts.map(x=>x.category).filter(Boolean))]}
function renderChips(){$("chips").innerHTML=cats().map(c=>'<button class="chip '+(c===currentCategory?"active":"")+'" onclick="setCat('+JSON.stringify(c)+')">'+esc(c)+'</button>').join("")}
function setCat(c){currentCategory=c;render();$("search").focus()}
function render(){
 renderChips();
 const q=$("search").value.toLowerCase().trim();
 const list=concepts.map((x,i)=>({...x,i})).filter(x=>(currentCategory==="All"||x.category===currentCategory)&&(!q||(x.title+" "+x.category+" "+x.explanation+" "+x.code).toLowerCase().includes(q)));
 $("grid").innerHTML=list.length?list.map(x=>'<article class="card"><span class="tag">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.explanation)+'</p>'+(x.code?'<div class="code">'+esc(x.code)+'</div>':'')+'<div class="actions"><button onclick="editConcept('+x.i+')">✏️ Edit</button><button onclick="deleteConcept('+x.i+')">🗑️ Delete</button></div></article>').join(""):'<div class="empty">No concepts found.</div>';
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function persist(){localStorage.setItem("conceptVault",JSON.stringify(concepts));render()}
function openModal(i=-1){editing=i;$("modalTitle").textContent=i<0?"Add Concept":"Edit Concept";let x=i<0?{title:"",category:"",explanation:"",code:""}:concepts[i];$("title").value=x.title;$("category").value=x.category;$("explanation").value=x.explanation;$("code").value=x.code;$("overlay").classList.add("show");$("title").focus()}
function closeModal(){$("overlay").classList.remove("show")}
function editConcept(i){openModal(i)}
function deleteConcept(i){if(confirm("Delete this concept?")){concepts.splice(i,1);persist()}}
$("addBtn").onclick=()=>openModal();$("cancel").onclick=closeModal;
$("save").onclick=()=>{let x={title:$("title").value.trim(),category:$("category").value.trim()||"General",explanation:$("explanation").value.trim(),code:$("code").value.trim()};if(!x.title){alert("Please enter a title.");return}if(editing<0)concepts.unshift(x);else concepts[editing]=x;closeModal();persist()};
$("search").oninput=render;$("overlay").onclick=e=>{if(e.target===$("overlay"))closeModal()};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
